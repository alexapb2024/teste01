<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hospital Central da Polícia Militar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(rgba(0, 35, 25, 0.72), rgba(0, 20, 15, 0.82)),
        url("Untitled-1.png") center / cover no-repeat fixed;
    }

    .home {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
      text-align: center;
    }

    .conteudo {
      width: 100%;
      max-width: 850px;
      padding: 50px 35px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      background-color: rgba(0, 0, 0, 0.35);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }

    .brasao {
      width: 100px;
      height: 100px;
      margin-bottom: 22px;
      object-fit: contain;
    }

    h1 {
      margin-bottom: 15px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .subtitulo {
      margin-bottom: 38px;
      color: #e4d192;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }

    .botao {
      min-width: 245px;
      padding: 16px 25px;
      border: 2px solid #ffffff;
      border-radius: 8px;
      color: #ffffff;
      background-color: rgba(0, 80, 55, 0.75);
      font-size: 1.05rem;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .botao:hover,
    .botao:focus {
      color: #153c2e;
      background-color: #ffffff;
      transform: translateY(-3px);
      outline: none;
    }

    @media (max-width: 600px) {
      .conteudo {
        padding: 35px 20px;
      }

      .menu {
        flex-direction: column;
      }

      .botao {
        width: 100%;
        min-width: auto;
      }
    }
  </style>
</head>

<body>
  <main class="home">
    <section class="conteudo">
      <!-- Opcional: remova esta linha caso não tenha um brasão -->
      <img
        class="brasao"
        src="Untitled-1.png"
        alt="Brasão da Polícia Militar"
      >

      <h1>Hospital Central da Polícia Militar</h1>

      <p class="subtitulo">Portal Institucional</p>

      <nav class="menu" aria-label="Menu principal">
        <a class="botao" href="boletim-interno.html">
          Boletim Interno
        </a>

        <a class="botao" href="pops-setores.html">
          POP's dos Setores
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
